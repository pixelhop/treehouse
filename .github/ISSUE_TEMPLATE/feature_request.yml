name: Feature request
description: Suggest an idea or improvement for Treehouse
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For open-ended ideas or questions, consider
        starting a [Discussion](https://github.com/pixelhop/treehouse/discussions)
        first — it's a better place to explore direction before it becomes a
        tracked feature request.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point. "I'm always frustrated when …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Which part of Treehouse would this affect?
      options:
        - API / MCP server
        - Web app
        - CLI
        - Workers
        - Self-hosting
        - Docs
        - Not sure
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — mockups, links, related issues.
    validations:
      required: false