# Local Postgres for development.
#   pnpm --filter db run db:up     # start (detached)
#   pnpm --filter db run db:down   # stop
# Connection string (see packages/db/.env.example):
#   postgresql://postgres:postgres@127.0.0.1:54328/postgres
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "54328:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: