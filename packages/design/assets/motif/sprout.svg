<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Sprout motif — two leaves on a young stem rising from a soil mound.
       Growth, onboarding, "something new was planted" moments. -->
  <!-- Soil mound -->
  <ellipse cx="48" cy="84" rx="26" ry="6" fill="#C89A5B" opacity="0.55"/>
  <!-- Stem with a gentle S curve -->
  <path d="M48 84 C48 70 46 60 48 46" stroke="#2E7D58" stroke-width="4" stroke-linecap="round"/>
  <!-- Left leaf -->
  <path d="M48 46 C46 28 34 18 16 16 C14 36 26 48 48 46 Z" fill="#6BA368"/>
  <path d="M44 43 C36 36 28 28 22 21" stroke="#F7F4EC" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right leaf -->
  <path d="M48 50 C52 35 64 27 80 27 C80 45 68 55 48 50 Z" fill="#2E7D58"/>
  <path d="M52 47 C59 42 66 37 72 32" stroke="#F7F4EC" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
</svg>
