<!doctype html>
<!--
  Source of public/og.png, the social preview card (Open Graph / Twitter) for
  trytree.house. Regenerate after editing: open this file in Chrome with the
  viewport at exactly 1200x630, wait for the fonts, screenshot the viewport and
  save it over public/og.png. The copy follows the homepage hero.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Nunito+Sans:opsz,wght@6..12,400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f7f4ec;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
      }
      .copy {
        position: relative;
        z-index: 2;
        width: 640px;
        padding: 64px 0 56px 72px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 60px;
        height: 60px;
      }
      .brand span {
        font-family: Fraunces, serif;
        font-weight: 600;
        font-size: 34px;
        color: #2b2f33;
        letter-spacing: -0.01em;
        font-variation-settings:
          "SOFT" 50,
          "opsz" 72;
      }
      h1 {
        margin-top: 52px;
        font-family: Fraunces, serif;
        font-weight: 600;
        font-size: 64px;
        line-height: 1.04;
        letter-spacing: -0.015em;
        color: #2b2f33;
        font-variation-settings:
          "SOFT" 50,
          "opsz" 144;
      }
      h1 em {
        color: #2e7d58;
        font-style: italic;
      }
      p {
        margin-top: 26px;
        font-family: "Nunito Sans", sans-serif;
        font-size: 25px;
        line-height: 1.45;
        color: #5a5f55;
        max-width: 520px;
      }
      .url {
        margin-top: auto;
        font-family: "Nunito Sans", sans-serif;
        font-weight: 700;
        font-size: 22px;
        color: #235f44;
        letter-spacing: 0.01em;
      }
      .art {
        position: absolute;
        right: -40px;
        top: -20px;
        width: 670px;
        height: 670px;
      }
      .art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .art::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          #f7f4ec 0%,
          rgba(247, 244, 236, 0.85) 10%,
          rgba(247, 244, 236, 0) 30%
        );
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="art"><img src="../../../design/assets/raster/hero-treehouse.webp" alt="" /></div>
      <div class="copy">
        <div class="brand">
          <img src="../../../design/assets/logo/treehouse.svg" alt="" /><span>Treehouse</span>
        </div>
        <h1>Your team’s<br />second brain,<br /><em>open to everyone</em></h1>
        <p>One shared folder of plain files, for your team and your agents.</p>
        <div class="url">trytree.house</div>
      </div>
    </div>
  </body>
</html>
